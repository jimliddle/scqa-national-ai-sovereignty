        function PostureScorer() {
          const [weights, setWeights] = useState({ infra: 5, regulation: 3, sovereignty: 4, openness: 3, speed: 5, talent: 5 });
          const totalWeight = Object.values(weights).reduce((a, b) => a + b, 0) || 1;

          const scored = useMemo(() => {
            const byCountry = {};
            INITIATIVES.forEach(init => {
              if (!byCountry[init.country]) byCountry[init.country] = { ...init, count: 1 };
              else { Object.keys(weights).forEach(k => { byCountry[init.country][k] += init[k]; }); byCountry[init.country].count++; }
            });
            return Object.entries(byCountry).map(([country, data]) => {
              const n = data.count;
              const score = Object.keys(weights).reduce((s, k) => s + (data[k] / n) * (weights[k] / totalWeight), 0);
              return { country, flag: data.flag, score: Math.round(score * 10), archetype: data.archetype };
            }).sort((a, b) => b.score - a.score);
