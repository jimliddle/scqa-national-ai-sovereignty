        function PostureScorer() {
          const [weights, setWeights] = useState({ infra: 5, regulation: 3, sovereignty: 4, openness: 3, speed: 5, talent: 5 });
          const totalWeight = Object.values(weights).reduce((a, b) => a + b, 0) || 1;

          const scored = useMemo(() => {
            const byCountry = {};
            INITIATIVES.forEach(init => {
              if (!byCountry[init.country]) byCountry[init.country] = { ...init, count: 1 };
              else { Object.keys(weights).forEach(k => { byCountry[init.country][k] += init[k]; }); byCountry[init.country].count++; }
            });
            return Object.entries(byCountry).map(([country, data]) => {
              const n = data.count;
              const score = Object.keys(weights).reduce((s, k) => s + (data[k] / n) * (weights[k] / totalWeight), 0);
              return { country, flag: data.flag, score: Math.round(score * 10), archetype: data.archetype };
            }).sort((a, b) => b.score - a.score);
          }, [weights, totalWeight]);

          return (
            <div className="space-y-5">
              <div className="glass-panel rounded-xl p-5 shadow-lg">

                        </div>
                        <input aria-label={label + " weight"} type="range" min={0} max={10} value={weights[key]}
                        onChange={e => setWeights(w => ({ ...w, [key]: parseInt(e.target.value) }))}

                    </div>

                </div>
              </div>

              <div className="glass-panel rounded-xl p-5 space-y-4 text-sm text-slate-300">
                <h3 className="text-lg font-bold text-white">Scoring methodology and weighting</h3>
                <p>Each programme has six editorial scores from 1 to 10. First average the selected programmes within each country for each dimension; then apply your normalized weights. Programmes receive equal weight within a country, regardless of budget. Countries with different programme coverage are not measured on an identical evidence base.</p>
                <p className="font-mono text-xs bg-slate-950 rounded p-3">Score / 100 = round(10 × Σ(country dimension mean × weight / sum of weights))</p>
                <p>Defaults: infrastructure 20%, regulatory maturity 12%, tech sovereignty 16%, openness 12%, execution speed 20%, talent 20%. These are editorial starting preferences, not statistically calibrated weights. A zero weight excludes a dimension. If every weight is zero, displayed scores are 0 and no meaningful ranking exists. Rounding can create ties; small gaps are not evidence of significant national differences.</p>
                <p>Score bands: 1–3 early; 4–6 developing; 7–8 strong; 9–10 leading within the sample. The criteria below guide judgment; they are not a mechanical conversion of budgets or benchmark results. Exact point choices remain editorial, with no measured uncertainty intervals. Sources and programme notes are in Inventory.</p>
                <div className="overflow-x-auto"><table className="w-full text-xs text-left"><thead><tr className="text-slate-400"><th className="py-2 pr-4">Dimension</th><th>Evidence considered</th></tr></thead><tbody className="divide-y divide-slate-800">
                  {[
                    ['Infrastructure','Accessible compute, commissioning, power and grid delivery. Plans and fund envelopes are weaker evidence than operational capacity.'],
                    ['Regulatory maturity','Implemented rules, accountable institutions and enforceable guidance. More restrictive rules do not automatically mean a higher score.'],
                    ['Tech sovereignty','Domestic developer control, model deployment rights, supplier diversity and exit options. Foreign-owned local research is not domestic frontier ownership.'],
                    ['Openness / collaboration','Usable model licences, shared compute access and cross-border partnerships; openness can coexist with external dependencies.'],
                    ['Execution speed','Delivered milestones and elapsed implementation; pauses and unfulfilled targets reduce confidence.'],

                </tbody></table></div>
                <p><strong>UK worked example at default weights:</strong> 10 × (5×0.20 + 7×0.12 + 4×0.16 + 8×0.12 + 5×0.20 + 9×0.20) = 62.4 → <strong>62/100</strong>. Infrastructure 5 and speed 5 reflect the Stargate pause while retaining delivered public compute credit. Sovereignty 4 reflects foreign frontier dependence and early domestic development; talent 9 reflects research strengths. Previously 66, before sovereignty was revised 6→4.</p>
                <p>Model capability/control scores in Models &amp; Control are separate. Frontier capability does not enter this six-factor formula directly; domestic control and external dependencies inform the sovereignty judgment. The £500M UK fund envelope receives no automatic score uplift. Radar archetypes are fixed illustrations; heatmap values are country dimension means.</p>
                <details><summary className="cursor-pointer font-bold text-blue-300">Inspect country inputs and current weighted results</summary><div className="overflow-x-auto mt-3"><table className="w-full text-xs text-left"><thead><tr><th className="p-2">Country / programmes</th>{Object.values(DIM_LABELS).map(label=><th key={label} className="p-2">{label}</th>)}<th className="p-2">Current /100</th></tr></thead><tbody>{scored.map(row=>{const items=INITIATIVES.filter(i=>i.country===row.country);return <tr key={row.country} className="border-t border-slate-800"><th className="p-2">{row.country} ({items.length})</th>{Object.keys(DIM_LABELS).map(k=><td className="p-2" key={k}>{(items.reduce((sum,i)=>sum+i[k],0)/items.length).toFixed(2)}</td>)}<td className="p-2 font-bold">{row.score}</td></tr>;})}</tbody></table></div></details>
              </div>

              <div className="glass-panel rounded-xl p-5 shadow-lg">
